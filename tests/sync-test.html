<script>
  // Separate storage keys so this page never touches real app data or a real token; no automatic triggers.
  window.GS_CONFIG_OVERRIDE={STORE_KEY:'gsTest.v1', SYNC_KEY:'gsTest.sync', DEVICE_KEY:'gsTest.device', TOKEN_KEY:'gsTest.token', SYNC_AUTO:false};
  Object.keys(localStorage).filter(k=>k.startsWith('gsTest.')).forEach(k=>localStorage.removeItem(k));
</script>

<body>
<h1>Sync engine tests against a mock GitHub</h1>
<p>Loads the real <code>config.js</code>, <code>sync-merge.js</code>, <code>md-format.js</code>, <code>sync-plan.js</code>, <code>store.js</code>, <code>github.js</code> and <code>sync.js</code>; <code>tests/github-mock.js</code> stands in for api.github.com. "Devices" are simulated by swapping the stored data and sync bookkeeping.</p>
<div class="sum" id="sum">Running…</div>
<table><thead><tr><th>#</th><th>Case</th><th>Result</th><th>Detail</th></tr></thead><tbody id="rows"></tbody></table>
<script src="../js/config.js"></script>
<script src="github-mock.js"></script>
<script src="../js/sync-merge.js"></script>
<script src="../js/md-format.js"></script>
<script src="../js/sync-plan.js"></script>
<script src="../js/store.js"></script>
<script src="../js/github.js"></script>
<script src="../js/sync.js"></script>
<script>
(async function(){
  const C=GS_CONFIG, M=GitHubMock, S=Store, SM=SyncMerge, MD=MdFormat;
  await M.install();
  const results=[];
  const ok=(c,msg)=>{ if(!c) throw new Error(msg||'assertion failed'); };
  const eq=(a,b,msg)=>{ const sa=JSON.stringify(a), sb=JSON.stringify(b); if(sa!==sb) throw new Error((msg||'not equal')+'\n  got:      '+sa+'\n  expected: '+sb); };
  async function test(name, fn){ try{ const d=await fn(); results.push({name, ok:true, detail:d||''}); }catch(e){ results.push({name, ok:false, detail:(e&&e.stack)||String(e)}); } }
  const ids=(arr)=>arr.map(r=>r.id).sort();
  const TOKEN='github_pat_TESTgoodtoken000000000000';
  M.addToken(TOKEN); M.addToken('github_pat_readonly', {write:false, push:false}); M.addToken('github_pat_ro_finegrained', {write:false, push:true});
  M.addToken('github_pat_otherrepo', {access:false}); M.addToken('github_pat_expired', {valid:false});
  const guitarFiles=()=>{ const f=M.files(); const o={}; Object.keys(f).filter(p=>p.startsWith('guitar/')).forEach(p=>o[p]=f[p]); return o; };
  const sessionsInRepo=()=>Object.entries(M.files()).filter(([p])=>p.startsWith('guitar/sessions/')).map(([p,t])=>{ try{ return MD.parseFile(p,t).record; }catch(e){ return null; } }).filter(Boolean); // skips the deliberately broken file
  const sync=()=>Sync.syncNow({manual:true});

  // ---- simulated devices ----
  const KEYS=[C.STORE_KEY, C.SYNC_KEY, C.DEVICE_KEY, C.TOKEN_KEY];
  const devices={}; let current=null;
  function useDevice(name, initialData, token){
    if(current) devices[current]=Object.fromEntries(KEYS.map(k=>[k, localStorage.getItem(k)]));
    const dev=devices[name];
    const set=(k,v)=>{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,v); };
    if(dev) KEYS.forEach(k=>set(k, dev[k]));
    else { KEYS.forEach(k=>set(k,null)); if(initialData) set(C.STORE_KEY, JSON.stringify(initialData)); if(token!==null) set(C.TOKEN_KEY, token||TOKEN); }
    current=name; S.load(); Sync._reloadMeta();
  }
  const now=Date.now();

  // ---------------- connect ----------------
  await test('Connect: a good token validates (GET repo + a harmless blob write), headers are right, token only in the Authorization header', async()=>{
    M.clearCalls(); const r=await GH.validate(TOKEN); eq(r.private,true);
    const cs=M.calls(); eq(cs.map(c=>c.method+' '+c.path),['GET /repos/tjmitch4/studio-data','POST /repos/tjmitch4/studio-data/git/blobs']);
    cs.forEach(c=>{ eq(c.headers['authorization'],'Bearer '+TOKEN); eq(c.headers['accept'],'application/vnd.github+json'); eq(c.headers['x-github-api-version'],'2022-11-28'); eq(c.cache,'no-store'); ok(!c.url.includes(TOKEN),'token not in URL'); });
  });
  await test('Connect: 401 (bad/expired token) → clear message', async()=>{
    let e=null; try{ await GH.validate('github_pat_expired'); }catch(x){ e=x; } ok(e); eq(e.kind,'auth'); ok(/not valid \(401\)/.test(e.message), e.message); ok(!e.message.includes('github_pat'),'token not echoed');
  });
  await test('Connect: 404 (token without access to studio-data) → clear message', async()=>{
    let e=null; try{ await GH.validate('github_pat_otherrepo'); }catch(x){ e=x; } eq(e.kind,'notfound'); ok(/Only select repositories/.test(e.message), e.message);
  });
  await test('Connect: read-only token (push:false) → clear message', async()=>{
    let e=null; try{ await GH.validate('github_pat_readonly'); }catch(x){ e=x; } eq(e.kind,'readonly'); ok(/Read and write/.test(e.message));
  });
  await test('Connect: fine-grained read-only token (repo reports push:true, but writing is refused) → caught by the blob check', async()=>{
    let e=null; try{ await GH.validate('github_pat_ro_finegrained'); }catch(x){ e=x; } eq(e && e.kind,'readonly');
  });
  await test('No token: sync does nothing and makes no requests', async()=>{
    useDevice('none', null, null); M.clearCalls(); eq(await sync(),'notconnected'); eq(M.calls().length,0); eq(Sync.view(),'notconnected');
  });

  // ---------------- first sync, idle, second device ----------------
  await test('First sync on device A: one commit with a file per session/song + trainer month + settings + PROGRESS.md; lift/ untouched', async()=>{
    useDevice('A', null); const d=S.get();
    d.sessions.push({id:'a1aaaaamfz0001',date:'2026-09-20',minutes:30,cats:['Song'],song:'Lenny',notes:'A1 — “bends” 🎸',created:'2026-09-20T10:00:00Z',updatedAt:S.stamp(0)});
    d.sessions.push({id:'a2bbbbbmfz0002',date:'2026-09-21',minutes:10,cats:[],song:'',notes:'A2',created:'2026-09-21T10:00:00Z',updatedAt:S.stamp(0)});
    d.songs.push({id:'songAxxmfz0003',title:'Little Wing',status:'Learning',tempo:80,curTempo:60,updatedAt:S.stamp(0)});
    S.setPref('useFlats',true); d.quiz={attempts:[{s:0,f:5,pc:9,ok:true,ms:900,mode:'find',lvl:1,ts:Date.UTC(2026,8,20)}]}; d.quiz.attempts[0].id=SM.attemptId(d.quiz.attempts[0]);
    S.save();
    const before=M.commitCount(); M.clearCalls(); eq(await sync(),'synced'); eq(M.commitCount(), before+1, 'exactly one commit');
    ok(/^guitar: sync \(\d+ changed\) from \w+ [a-z0-9]{4}$/.test(M.commit().message), M.commit().message);
    const g=Object.keys(guitarFiles()).sort();
    eq(g, ['guitar/.gitkeep','guitar/PROGRESS.md','guitar/sessions/2026-09-20-song-a1aaaa.md','guitar/sessions/2026-09-21-practice-a2bbbb.md','guitar/settings.md','guitar/songs/little-wing-songax.md','guitar/songs/slow-dancing-in-a-burning-room-s1.md','guitar/trainer/2026-09.md']);
    eq(M.files()['lift/.gitkeep'],''); ok(M.files()['README.md'].startsWith('# studio-data'));
    eq(M.calls(c=>c.method==='PATCH').length,1); eq(M.calls(c=>c.method==='PATCH')[0].body.force,false);
    return M.commit().message;
  });
  await test('Idle sync: no commit, and just one request (the branch ref) when nothing changed anywhere', async()=>{
    const before=M.commitCount(); M.clearCalls(); eq(await sync(),'synced'); eq(M.commitCount(),before); eq(M.calls().map(c=>c.method+' '+c.path),['GET /repos/tjmitch4/studio-data/git/ref/heads/main']);
  });
  const oldFormat={sessions:[{date:'2026-08-30',minutes:20,cats:['Technique'],song:'',notes:'B old, no id',created:'2026-08-30T08:00:00.000Z'},
                             {id:'b1',date:'2026-09-02',minutes:40,cats:['Song'],song:'Slow Dancing in a Burning Room',tempo:62,notes:'B1',created:'2026-09-02T08:00:00.000Z'}],
    songs:[{id:'s1', title:'Slow Dancing in a Burning Room', artist:'John Mayer', status:'Learning', key:'C#m', tuning:'Standard', tempo:70, curTempo:'', sections:'Intro riff (C#m–A–E–B feel, hybrid picking)\nVerse comping\nChorus\nSolo phrasing', notes:'Current focus. Bend intonation on the intro; keep thumb steady on the bass notes.', links:'', added:'2026-08-16'},
           {id:'songB', title:'Pride and Joy', status:'Want', updated:1757000000000}],
    prefs:{useFlats:false, tone:'electric'}, version:1,
    quiz:{attempts:[{s:1,f:2,pc:11,ok:false,ms:3000,mode:'name',lvl:2,ts:Date.UTC(2026,7,15)}]},
    videos:{'2026-09-01_1900_Lenny.mp4':{song:'Lenny',notes:'check bends',date:'2026-09-01',reviewed:false}}};
  await test('Old-format data loads on device B (ids + timestamps filled in, nothing dropped)', async()=>{
    useDevice('B', oldFormat); ok(!S.loadFailed()); const d=S.get(); eq(d.sessions.length,2); ok(d.sessions.every(s=>s.id && typeof s.updatedAt==='number'));
    eq(d.songs.find(s=>s.id==='songB').updatedAt,1757000000000); eq(d.songs.find(s=>s.id==='s1').updatedAt,0); ok(d.quiz.attempts[0].id); eq(d.videos['2026-09-01_1900_Lenny.mp4'].updatedAt,0);
  });
  await test('First sync of device B (existing history): merges both ways, uploads everything B has, one seed song file', async()=>{
    eq(await sync(),'synced');
    const d=S.get(); eq(d.sessions.length,4); eq(ids(d.songs),['s1','songAxxmfz0003','songB']); eq(d.quiz.attempts.length,2); ok(d.videos['2026-09-01_1900_Lenny.mp4']);
    eq(d.prefs.useFlats,true,'A set useFlats with a timestamp'); eq(d.prefs.tone,'electric');
    eq(ids(sessionsInRepo()), ids(d.sessions)); const g=guitarFiles();
    ok(g['guitar/trainer/2026-08.md'] && g['guitar/trainer/2026-09.md'],'two month files'); ok(g['guitar/video-notes.md'].includes('check bends'));
    eq(Object.keys(g).filter(p=>p.startsWith('guitar/songs/')).length,3);
  });
  await test('Device A picks up B\'s data; both devices hold identical data', async()=>{
    const bData=JSON.parse(JSON.stringify(S.get()));
    useDevice('A'); eq(await sync(),'synced'); ok(SM.equal(S.get(), bData),'A == B');
  });
  await test('Cross-device edits: song edited on A and a pref changed on B both propagate', async()=>{
    const sa=S.get().songs.find(s=>s.id==='songAxxmfz0003'); sa.curTempo=72; S.touch(sa); S.save(); eq(await sync(),'synced');
    useDevice('B'); S.setPref('tone','nylon'); S.save(); eq(await sync(),'synced'); eq(S.get().songs.find(s=>s.id==='songAxxmfz0003').curTempo,72);
    useDevice('A'); eq(await sync(),'synced'); eq(S.get().prefs.tone,'nylon'); ok(guitarFiles()['guitar/songs/little-wing-songax.md'].includes('72 / 80 bpm (90% of target)'));
  });
  await test('PROGRESS.md regenerated on a change: sessions, song board, trainer', async()=>{
    const p=guitarFiles()['guitar/PROGRESS.md']; ['## Snapshot','## Weekly minutes','## Recent sessions','### Learning','Little Wing','## Note trainer','**Current level:**'].forEach(s=>ok(p.includes(s),'missing '+s));
  });

  // ---------------- deletes ----------------
  await test('Local delete on A removes the file; B (not edited there) deletes it too; tombstone forgotten after the commit', async()=>{
    S.remove('sessions','a1aaaaamfz0001'); S.save(); eq(await sync(),'synced');
    ok(!guitarFiles()['guitar/sessions/2026-09-20-song-a1aaaa.md'],'file removed'); ok(!(S.get().deleted.sessions||[]).some(t=>t.id==='a1aaaaamfz0001'),'tombstone dropped');
    useDevice('B'); eq(await sync(),'synced'); ok(!S.get().sessions.some(s=>s.id==='a1aaaaamfz0001'),'gone on B');
    eq(await sync(),'synced'); ok(!guitarFiles()['guitar/sessions/2026-09-20-song-a1aaaa.md'],'not resurrected');
  });
  await test('Edit vs delete: B edits a session A deleted (B hadn\'t seen the delete) → the edit wins and comes back to A', async()=>{
    const s=S.get().sessions.find(x=>x.id==='a2bbbbbmfz0002'); s.notes='B edited this'; S.touch(s); S.save();
    useDevice('A'); S.remove('sessions','a2bbbbbmfz0002'); S.save(); eq(await sync(),'synced'); ok(!guitarFiles()['guitar/sessions/2026-09-21-practice-a2bbbb.md']);
    useDevice('B'); eq(await sync(),'synced'); eq(S.get().sessions.find(x=>x.id==='a2bbbbbmfz0002').notes,'B edited this');
    ok(guitarFiles()['guitar/sessions/2026-09-21-practice-a2bbbb.md'],'re-uploaded with the same name');
    useDevice('A'); eq(await sync(),'synced'); eq(S.get().sessions.find(x=>x.id==='a2bbbbbmfz0002').notes,'B edited this');
  });
  await test('A session added and deleted between syncs never reaches GitHub (no commit)', async()=>{
    S.get().sessions.push({id:'tmpxxxxmfz0009',date:'2026-09-22',minutes:1,cats:[],notes:'oops',created:'',updatedAt:S.stamp(0)}); S.save(); S.remove('sessions','tmpxxxxmfz0009'); S.save();
    const before=M.commitCount(); eq(await sync(),'synced'); eq(M.commitCount(),before); eq((S.get().deleted.sessions||[]).length,0);
  });
  await test('Seed song s1 deleted on A stays deleted: a brand-new device with the pristine seed drops it too', async()=>{
    S.remove('songs','s1'); S.save(); eq(await sync(),'synced'); ok(!guitarFiles()['guitar/songs/slow-dancing-in-a-burning-room-s1.md']);
    ok(guitarFiles()['guitar/settings.md'].includes('"s1"'),'tombstone kept in settings.md');
    useDevice('C', null); ok(S.get().songs.some(s=>s.id==='s1'),'fresh device starts with the seed'); eq(await sync(),'synced');
    ok(!S.get().songs.some(s=>s.id==='s1'),'seed dropped on C'); ok(!guitarFiles()['guitar/songs/slow-dancing-in-a-burning-room-s1.md'],'not re-uploaded');
    useDevice('B'); eq(await sync(),'synced'); ok(!S.get().songs.some(s=>s.id==='s1'),'gone on B');
  });

  // ---------------- concurrency ----------------
  await test('Non-fast-forward: another device commits between our read and our ref update → re-read, re-merge, retry; both changes survive', async()=>{
    useDevice('A'); S.get().sessions.push({id:'a3cccccmfz0010',date:'2026-09-25',minutes:15,cats:[],notes:'A3',created:'',updatedAt:S.stamp(0)}); S.save();
    const rec={id:'c1dddddmfz0011',date:'2026-09-25',minutes:5,cats:['Theory'],notes:'from device C',created:'',updatedAt:Date.now()};
    M.beforeRefUpdate(async()=>{ await M.commitFiles({['guitar/sessions/2026-09-25-theory-c1dddd.md']:MD.sessionMd(rec)},'guitar: sync (1 changed) from iPhone zz99'); });
    M.clearCalls(); eq(await sync(),'synced');
    eq(M.calls(c=>c.method==='PATCH').length,2,'one refused + one retry'); eq(M.calls(c=>c.method==='PATCH' && c.status===422).length,1);
    ok(sessionsInRepo().some(s=>s.id==='a3cccccmfz0010') && sessionsInRepo().some(s=>s.id==='c1dddddmfz0011'),'both in repo'); ok(S.get().sessions.some(s=>s.id==='c1dddddmfz0011'),'C\'s session merged locally');
  });
  await test('Non-fast-forward three times in a row → gives up quietly (offline status), nothing lost, next sync succeeds', async()=>{
    S.get().sessions.push({id:'a4eeeeemfz0012',date:'2026-09-26',minutes:9,cats:[],notes:'A4',created:'',updatedAt:S.stamp(0)}); S.save();
    let n=0; const race=async()=>{ n++; await M.commitFiles({['guitar/race-'+n+'.txt']:'x'+n},'lift: other app'); if(n<3) M.beforeRefUpdate(race); };
    M.beforeRefUpdate(race); eq(await sync(),'offline'); ok(S.get().sessions.some(s=>s.id==='a4eeeeemfz0012'));
    eq(await sync(),'synced'); ok(sessionsInRepo().some(s=>s.id==='a4eeeeemfz0012')); ok(M.files()['guitar/race-3.txt'],'other files untouched');
  });

  // ---------------- robustness ----------------
  await test('Corrupt files are skipped with a warning, never deleted or overwritten, and never crash the sync', async()=>{
    await M.commitFiles({'guitar/sessions/2026-09-01-broken-zzzzzz.md':'# someone typed here\nno data block', 'guitar/songs/half-written-yyyyyy.md':'## Data\n```json\n{"id":"q", \n```'},'hand edit');
    const b1=M.shaOf('guitar/sessions/2026-09-01-broken-zzzzzz.md');
    eq(await sync(),'synced'); eq(M.shaOf('guitar/sessions/2026-09-01-broken-zzzzzz.md'),b1); ok(M.files()['guitar/songs/half-written-yyyyyy.md']);
    const w=Sync._meta().warnings||[]; eq(w.length,2,'two warnings'); ok(/no "## Data" section/.test(w.join(' ')));
    S.get().sessions[0].notes+=' (edit)'; S.touch(S.get().sessions[0]); S.save(); eq(await sync(),'synced'); eq(M.shaOf('guitar/sessions/2026-09-01-broken-zzzzzz.md'),b1,'still untouched');
  });
  await test('Corrupt settings.md is left alone (prefs not overwritten), other files still sync', async()=>{
    const good=M.files()['guitar/settings.md']; await M.commitFiles({'guitar/settings.md':'oops'},'bad edit');
    S.setPref('sound',false); S.save(); eq(await sync(),'synced'); eq(M.files()['guitar/settings.md'],'oops');
    await M.commitFiles({'guitar/settings.md':good},'fix'); eq(await sync(),'synced'); ok(M.files()['guitar/settings.md'].includes('"sound": false'),'written once readable again');
  });
  await test('Hand edit on GitHub (JSON changed, updatedAt not raised) wins over the unchanged local copy', async()=>{
    const p=Object.keys(M.files()).find(x=>x.includes('little-wing')); const rec=MD.parseFile(p, M.files()[p]).record; rec.notes='Coach: slow down the double stops';
    await M.commitFiles({[p]:MD.songMd(rec)},'Claude: note'); eq(await sync(),'synced');
    eq(S.get().songs.find(s=>s.id==='songAxxmfz0003').notes,'Coach: slow down the double stops');
    useDevice('B'); eq(await sync(),'synced'); eq(S.get().songs.find(s=>s.id==='songAxxmfz0003').notes,'Coach: slow down the double stops');
  });
  await test('Unicode survives the trip through GitHub\'s base64 blobs', async()=>{
    const t='Café — Añoranza ☃ 日本 🎸 “quotes” \'single\' `tick`\nline2';
    S.get().songs.push({id:'songUxxmfz0020',title:t,status:'Want',notes:t,updatedAt:S.stamp(0)}); S.save(); eq(await sync(),'synced');
    useDevice('A'); eq(await sync(),'synced'); const s=S.get().songs.find(x=>x.id==='songUxxmfz0020'); eq(s.title,t); eq(s.notes,t);
  });
  await test('Trainer: month buckets union across devices, 4000 cap keeps the newest, Reset on one device clears the others', async()=>{
    const mk=(from,to,dev)=>{ const out=[]; for(let i=from;i<to;i++){ const a={s:i%6,f:i%12,pc:i%12,ok:i%3>0,ms:900+dev,mode:'find',lvl:2,ts:Date.UTC(2026,5,1)+i*60000}; a.id=SM.attemptId(a); out.push(a); } return out; };
    const q=S.get().quiz; q.attempts=q.attempts.concat(mk(0,2500,1)); S.save(); eq(await sync(),'synced');
    useDevice('B'); S.get().quiz.attempts=S.get().quiz.attempts.concat(mk(1000,4600,2)); S.save(); eq(await sync(),'synced');
    const n=S.get().quiz.attempts.length; eq(n, SM.ATTEMPT_CAP);
    useDevice('A'); eq(await sync(),'synced'); eq(S.get().quiz.attempts.length, SM.ATTEMPT_CAP); ok(SM.equal(S.get().quiz, devicesQuiz('B')),'same answers on A and B');
    const months=Object.keys(guitarFiles()).filter(p=>p.startsWith('guitar/trainer/'));
    const inRepo=months.reduce((s,p)=>s+MD.parseFile(p,M.files()[p]).attempts.length,0); eq(inRepo, SM.ATTEMPT_CAP,'repo holds exactly the capped set');
    S.get().quiz={attempts:[], resetAt:S.stamp(Date.now())}; S.save(); eq(await sync(),'synced');
    eq(Object.keys(guitarFiles()).filter(p=>p.startsWith('guitar/trainer/')).length,0,'month files removed after reset');
    useDevice('B'); eq(await sync(),'synced'); eq(S.get().quiz.attempts.length,0,'reset reached B'); ok(S.get().quiz.resetAt>0);
    const a={s:0,f:0,pc:4,ok:true,ms:700,mode:'find',lvl:1,ts:Date.now()+5}; a.id=SM.attemptId(a); S.get().quiz.attempts.push(a); S.save(); eq(await sync(),'synced');
    useDevice('A'); eq(await sync(),'synced'); eq(S.get().quiz.attempts.length,1,'new answers after the reset still sync');
  });
  function devicesQuiz(name){ return JSON.parse(devices[name][C.STORE_KEY]).quiz; }
  await test('Video notes sync (keyed by file name); a deleted note stays deleted', async()=>{
    const v=S.get().videos; v['2026-09-27_2000_Lenny.mp4']={song:'Lenny',notes:'better vibrato',date:'2026-09-27',reviewed:true,updatedAt:S.stamp(0)}; S.remove('videos','2026-09-01_1900_Lenny.mp4'); S.save(); eq(await sync(),'synced');
    useDevice('B'); eq(await sync(),'synced'); ok(S.get().videos['2026-09-27_2000_Lenny.mp4'].reviewed); ok(!S.get().videos['2026-09-01_1900_Lenny.mp4']);
  });
  await test('Offline → "offline", local data kept, no error shown; back online → synced', async()=>{
    S.get().sessions.push({id:'b9fffffmfz0030',date:'2026-09-27',minutes:12,cats:[],notes:'offline session',created:'',updatedAt:S.stamp(0)}); S.save();
    M.set({offline:true}); eq(await sync(),'offline'); ok(S.get().sessions.some(s=>s.id==='b9fffffmfz0030')); ok(!Sync._meta().lastError);
    eq(await Sync.syncNow(),'offline','automatic trigger during backoff does nothing');
    M.set({offline:false}); eq(await sync(),'synced'); ok(sessionsInRepo().some(s=>s.id==='b9fffffmfz0030'));
  });
  await test('Rate limit → quiet backoff until the reset time, status offline with a note', async()=>{
    M.set({rateLimited:true}); eq(await sync(),'offline'); ok(/rate limit/i.test(Sync._meta().note||''), Sync._meta().note); M.clearCalls();
    eq(await Sync.syncNow(),'offline'); eq(M.calls().length,0,'automatic sync waits'); M.set({rateLimited:false}); eq(await sync(),'synced'); ok(!Sync._meta().note);
  });
  await test('Token revoked (401 during sync) → error, automatic syncs stop, local data kept', async()=>{
    const before=localStorage.getItem(C.STORE_KEY); localStorage.setItem(C.TOKEN_KEY,'github_pat_expired');
    eq(await sync(),'error'); ok(/rejected/.test(Sync._meta().lastError)); eq(localStorage.getItem(C.STORE_KEY),before);
    M.clearCalls(); await Sync.syncNow(); eq(M.calls().length,0,'no automatic retries with a bad token');
    localStorage.setItem(C.TOKEN_KEY,TOKEN); Sync._reloadMeta(); eq(await sync(),'synced'); eq(Sync.view(),'synced');
  });
  await test('Unreadable local data (blocked): never syncs', async()=>{
    const good=localStorage.getItem(C.STORE_KEY); localStorage.setItem(C.STORE_KEY,'{not json'); S.load(); ok(S.loadFailed());
    M.clearCalls(); eq(await sync(),'blocked'); eq(M.calls().length,0);
    localStorage.setItem(C.STORE_KEY,good); Object.keys(localStorage).filter(k=>k.startsWith(C.STORE_KEY+'.corrupt-')).forEach(k=>localStorage.removeItem(k)); S.load(); ok(!S.loadFailed());
  });
  await test('Cleared storage on a device (bookkeeping kept, data gone) → everything comes back from GitHub', async()=>{
    const want=JSON.parse(JSON.stringify(S.get())); localStorage.removeItem(C.STORE_KEY); S.load(); eq(S.get().sessions.length,0);
    eq(await sync(),'synced'); ok(SM.equal(S.get(), want), 'restored');
  });
  await test('Truncated tree listing → falls back to listing guitar/ directly', async()=>{
    useDevice('D', null); M.set({truncate:true}); eq(await sync(),'synced'); M.set({truncate:false}); ok(S.get().sessions.length>3,'D got the sessions');
  });
  await test('Convergence: A, B, C, D and the repo all hold the same data after a round of syncs', async()=>{
    for(const d of ['A','B','C','D']){ useDevice(d); eq(await sync(),'synced'); }
    for(const d of ['A','B','C']){ useDevice(d); eq(await sync(),'synced'); }
    const snap={}; for(const d of ['A','B','C','D']){ useDevice(d); snap[d]=JSON.parse(JSON.stringify(S.get())); }
    ['B','C','D'].forEach(d=>ok(SM.equal(snap.A, snap[d]), 'A != '+d+'\n'+SM.canonical(snap.A)+'\n'+SM.canonical(snap[d])));
    eq(ids(sessionsInRepo()), ids(snap.A.sessions)); const before=M.commitCount(); for(const d of ['A','B']){ useDevice(d); await sync(); } eq(M.commitCount(),before,'idle devices make no commits');
  });
  await test('The token is never stored anywhere but its own key, and never written to the repo', async()=>{
    Object.keys(localStorage).filter(k=>k!==C.TOKEN_KEY && !k.startsWith('gsMock.')).forEach(k=>ok(!(localStorage.getItem(k)||'').includes('github_pat_'), 'token in '+k));
    Object.values(M.files()).forEach(t=>ok(!t.includes('github_pat_'),'token in a repo file'));
    M.calls().forEach(c=>ok(!c.url.includes('github_pat_'),'token in a URL'));
  });

  const rows=document.getElementById('rows'); let pass=0;
  results.forEach((r,i)=>{ if(r.ok) pass++; const tr=document.createElement('tr'); tr.innerHTML=`<td>${i+1}</td><td></td><td class="${r.ok?'pass':'fail'}">${r.ok?'PASS':'FAIL'}</td><td><pre></pre></td>`; tr.children[1].textContent=r.name; tr.querySelector('pre').textContent=r.detail; rows.append(tr); });
  const sum=document.getElementById('sum'); sum.textContent=`${pass}/${results.length} passed`+(pass===results.length?' — all green':''); sum.className='sum '+(pass===results.length?'pass':'fail');
  window.__syncResults={pass,total:results.length,failed:results.filter(r=>!r.ok).map(r=>r.name+': '+r.detail)};
  Object.keys(localStorage).filter(k=>k.startsWith('gsTest.')).forEach(k=>localStorage.removeItem(k));
})();
</script>
